name: poker_trainer
description: >
  Aplicación móvil de entrenamiento de póker (Floply): motor pedagógico de
  la Academia (326 teorías) con ejercicios interactivos, sin backend.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/curriculum_spec.json
