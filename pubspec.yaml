name: poker_trainer
description: >
  Aplicación móvil de entrenamiento de póker — etapa 1: pantalla de inicio
  (Home/Dashboard) visual, sin backend ni lógica funcional todavía.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
